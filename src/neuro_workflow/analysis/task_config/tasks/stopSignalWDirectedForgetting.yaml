tr: 1.49
dummy_scans: 7
min_rt: 0.2
expected_sessions: 2

# Stop-signal + directed forgetting dual task
# Trial types cross go/stop outcome with directed-forgetting condition.
# Nuisance regressors (omission, commission, rt_fast) are computed only for go trials.
# The response_time regressor uses RT as duration for correct go trials.

regressors:
  go_omission:
    amplitude: omission
    duration: duration
    subset: null

  go_commission:
    amplitude: commission
    duration: duration
    subset: null

  go_rt_fast:
    amplitude: rt_too_fast
    duration: duration
    subset: null

  go_pos:
    amplitude: 1
    duration: 1
    subset: >-
      trial_id == 'test_trial' and key_press == correct_response and response_time >= 0.2 and
      trial_type == 'go_pos'

  go_neg:
    amplitude: 1
    duration: 1
    subset: >-
      trial_id == 'test_trial' and key_press == correct_response and response_time >= 0.2 and
      trial_type == 'go_neg'

  go_con:
    amplitude: 1
    duration: 1
    subset: >-
      trial_id == 'test_trial' and key_press == correct_response and response_time >= 0.2 and
      trial_type == 'go_con'

  stop_success_pos:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'stop_success_pos'

  stop_success_neg:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'stop_success_neg'

  stop_success_con:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'stop_success_con'

  stop_failure_pos:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'stop_failure_pos'

  stop_failure_neg:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'stop_failure_neg'

  stop_failure_con:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'stop_failure_con'

  memory_and_cue:
    amplitude: 1
    duration: duration
    subset: >-
      trial_id == "test_stim" or trial_id == "test_cue"

  break_with_performance_feedback:
    amplitude: 1
    duration: 10
    subset: >-
      trial_id == 'break_with_performance_feedback'
    events_query_min_coverage: 0.0

  response_time:
    amplitude: 1
    duration: response_time
    subset: >-
      trial_id == 'test_trial' and key_press == correct_response and response_time >= 0.2 and
      (trial_type == 'go_pos' or trial_type == 'go_neg' or trial_type == 'go_con')

contrasts:
  go_pos: "go_pos"
  go_neg: "go_neg"
  go_con: "go_con"
  stop_success_pos: "stop_success_pos"
  stop_success_neg: "stop_success_neg"
  stop_success_con: "stop_success_con"
  stop_failure_pos: "stop_failure_pos"
  stop_failure_neg: "stop_failure_neg"
  stop_failure_con: "stop_failure_con"
  go_neg-go_con: "go_neg-go_con"
  stop_success_con-go_con: "stop_success_con-go_con"
  (stop_success_con+stop_success_pos+stop_success_neg)-(go_con+go_pos+go_neg): "1/3*(stop_success_con+stop_success_pos+stop_success_neg)-1/3*(go_con+go_pos+go_neg)"
  (stop_failure_con+stop_failure_pos+stop_failure_neg)-(go_con+go_pos+go_neg): "1/3*(stop_failure_con+stop_failure_pos+stop_failure_neg)-1/3*(go_con+go_pos+go_neg)"
  stopSignalWDirectedForgetting_stop_success_interaction: "1/2*(stop_success_neg-go_neg)-1/2*(stop_success_con-go_con)"
  stopSignalWDirectedForgetting_stop_failure_interaction: "1/2*(stop_failure_neg-go_neg)-1/2*(stop_failure_con-go_con)"
  task-baseline: "1/10*(go_pos+go_neg+go_con+stop_success_pos+stop_success_neg+stop_success_con+stop_failure_pos+stop_failure_neg+stop_failure_con+memory_and_cue)"
  response_time: "response_time"
