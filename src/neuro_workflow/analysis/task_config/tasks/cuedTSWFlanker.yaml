tr: 1.49
dummy_scans: 7
min_rt: 0.2
expected_sessions: 2

# Cued task-switching + flanker dual task
# Trial types cross cue/task switch condition with flanker congruency.
# The response_time regressor uses RT as duration (RTDur model).

regressors:
  omission:
    amplitude: omission
    duration: duration
    subset: null

  commission:
    amplitude: commission
    duration: duration
    subset: null

  rt_fast:
    amplitude: rt_too_fast
    duration: duration
    subset: null

  n/a:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type ==
      'cn/a_tn/a_incongruent' or trial_type == 'cn/a_tn/a_congruent'

  cue_stay_task_stay_congruent:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'cstay_tstay_congruent' and key_press == correct_response and
      response_time >= 0.2

  cue_stay_task_stay_incongruent:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'cstay_tstay_incongruent' and key_press == correct_response and
      response_time >= 0.2

  cue_switch_task_switch_congruent:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'cswitch_tswitch_congruent' and key_press == correct_response and
      response_time >= 0.2

  cue_switch_task_switch_incongruent:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'cswitch_tswitch_incongruent' and key_press == correct_response and
      response_time >= 0.2

  cue_switch_task_stay_congruent:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'cswitch_tstay_congruent' and key_press == correct_response and
      response_time >= 0.2

  cue_switch_task_stay_incongruent:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'cswitch_tstay_incongruent' and key_press == correct_response and
      response_time >= 0.2

  response_time:
    amplitude: 1
    duration: response_time
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_id == 'test_trial' and
      trial_type != 'cn/a_tn/a_incongruent' and trial_type != 'cn/a_tn/a_congruent'

  break_with_performance_feedback:
    amplitude: 1
    duration: 10
    subset: >-
      trial_id == 'break_with_performance_feedback'
    events_query_min_coverage: 0.0

contrasts:
  cue_stay_task_stay_congruent: "cue_stay_task_stay_congruent"
  cue_stay_task_stay_incongruent: "cue_stay_task_stay_incongruent"
  cue_switch_task_switch_congruent: "cue_switch_task_switch_congruent"
  cue_switch_task_switch_incongruent: "cue_switch_task_switch_incongruent"
  cue_switch_task_stay_congruent: "cue_switch_task_stay_congruent"
  cue_switch_task_stay_incongruent: "cue_switch_task_stay_incongruent"
  cue_stay_task_stay_incongruent-cue_stay_task_stay_congruent: "cue_stay_task_stay_incongruent-cue_stay_task_stay_congruent"
  cue_switch_task_stay_congruent-cue_stay_task_stay_congruent: "cue_switch_task_stay_congruent-cue_stay_task_stay_congruent"
  cue_switch_task_switch_congruent-cue_switch_task_stay_congruent: "cue_switch_task_switch_congruent-cue_switch_task_stay_congruent"
  cuedTSWFlanker_cuedTS_incongruent_minus_congruent: "1/3*(cue_stay_task_stay_incongruent+cue_switch_task_switch_incongruent+cue_switch_task_stay_incongruent)-1/3*(cue_stay_task_stay_congruent+cue_switch_task_switch_congruent+cue_switch_task_stay_congruent)"
  cuedTSWFlanker_flanker_cue_switch_cost: "1/2*(cue_switch_task_stay_congruent+cue_switch_task_stay_incongruent)-1/2*(cue_stay_task_stay_congruent+cue_stay_task_stay_incongruent)"
  cuedTSWFlanker_flanker_task_switch_cost: "1/2*(cue_switch_task_switch_congruent+cue_switch_task_switch_incongruent)-1/2*(cue_switch_task_stay_congruent+cue_switch_task_stay_incongruent)"
  cuedTSWFlanker_cue_switch_cost_interaction: "1/2*(cue_switch_task_stay_incongruent-cue_stay_task_stay_incongruent)-1/2*(cue_switch_task_stay_congruent-cue_stay_task_stay_congruent)"
  cuedTSWFlanker_task_switch_cost_interaction: "1/2*(cue_switch_task_switch_incongruent-cue_switch_task_stay_incongruent)-1/2*(cue_switch_task_switch_congruent-cue_switch_task_stay_congruent)"
  task-baseline: "1/6*(cue_stay_task_stay_congruent+cue_stay_task_stay_incongruent+cue_switch_task_switch_congruent+cue_switch_task_switch_incongruent+cue_switch_task_stay_congruent+cue_switch_task_stay_incongruent)"
  response_time: "response_time"
