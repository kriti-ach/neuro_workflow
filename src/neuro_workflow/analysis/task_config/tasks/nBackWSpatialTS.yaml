tr: 1.49
dummy_scans: 7
min_rt: 0.2
expected_sessions: 2

# N-back + spatial task-switching dual task
# Trial types cross match/mismatch and delay with spatial switch condition.
# The response_time regressor uses RT as duration (RTDur model).

regressors:
  omission:
    amplitude: omission
    duration: duration
    subset: null

  commission:
    amplitude: commission
    duration: duration
    subset: null

  rt_fast:
    amplitude: rt_too_fast
    duration: duration
    subset: null

  n/a:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type == 'n/a'

  match_task_stay_cue_stay_1back:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'match_tstay_cstay' and delay == 1 and key_press == correct_response and
      response_time >= 0.2

  match_task_stay_cue_switch_1back:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'match_tstay_cswitch' and delay == 1 and key_press == correct_response and
      response_time >= 0.2

  match_task_switch_cue_switch_1back:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'match_tswitch_cswitch' and delay == 1 and key_press == correct_response
      and response_time >= 0.2

  mismatch_task_stay_cue_stay_1back:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'mismatch_tstay_cstay' and delay == 1 and key_press == correct_response
      and response_time >= 0.2

  mismatch_task_stay_cue_switch_1back:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'mismatch_tstay_cswitch' and delay == 1 and key_press == correct_response
      and response_time >= 0.2

  mismatch_task_switch_cue_switch_1back:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'mismatch_tswitch_cswitch' and delay == 1 and key_press ==
      correct_response and response_time >= 0.2

  match_task_stay_cue_stay_2back:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'match_tstay_cstay' and delay == 2 and key_press == correct_response and
      response_time >= 0.2

  match_task_stay_cue_switch_2back:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'match_tstay_cswitch' and delay == 2 and key_press == correct_response and
      response_time >= 0.2

  match_task_switch_cue_switch_2back:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'match_tswitch_cswitch' and delay == 2 and key_press == correct_response
      and response_time >= 0.2

  mismatch_task_stay_cue_stay_2back:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'mismatch_tstay_cstay' and delay == 2 and key_press == correct_response
      and response_time >= 0.2

  mismatch_task_stay_cue_switch_2back:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'mismatch_tstay_cswitch' and delay == 2 and key_press == correct_response
      and response_time >= 0.2

  mismatch_task_switch_cue_switch_2back:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'mismatch_tswitch_cswitch' and delay == 2 and key_press ==
      correct_response and response_time >= 0.2

  response_time:
    amplitude: 1
    duration: response_time
    subset: >-
      trial_id == 'test_trial' and key_press == correct_response and response_time >= 0.2 and
      trial_type != 'n/a'

  break_with_performance_feedback:
    amplitude: 1
    duration: 10
    subset: >-
      trial_id == 'break_with_performance_feedback'
    events_query_min_coverage: 0.0

contrasts:
  mismatch_task_stay_cue_stay_1back: "mismatch_task_stay_cue_stay_1back"
  mismatch_task_stay_cue_switch_1back: "mismatch_task_stay_cue_switch_1back"
  mismatch_task_switch_cue_switch_1back: "mismatch_task_switch_cue_switch_1back"
  match_task_stay_cue_stay_1back: "match_task_stay_cue_stay_1back"
  match_task_stay_cue_switch_1back: "match_task_stay_cue_switch_1back"
  match_task_switch_cue_switch_1back: "match_task_switch_cue_switch_1back"
  mismatch_task_stay_cue_stay_2back: "mismatch_task_stay_cue_stay_2back"
  mismatch_task_stay_cue_switch_2back: "mismatch_task_stay_cue_switch_2back"
  mismatch_task_switch_cue_switch_2back: "mismatch_task_switch_cue_switch_2back"
  match_task_stay_cue_stay_2back: "match_task_stay_cue_stay_2back"
  match_task_stay_cue_switch_2back: "match_task_stay_cue_switch_2back"
  match_task_switch_cue_switch_2back: "match_task_switch_cue_switch_2back"
  nBackWSpatialTS_spatialTS_off_2back_minus_1back: "1/2*(match_task_stay_cue_stay_2back+mismatch_task_stay_cue_stay_2back)-1/2*(match_task_stay_cue_stay_1back+mismatch_task_stay_cue_stay_1back)"
  nBackWSpatialTS_nBack_off_cue_switch_cost: "1/2*(match_task_stay_cue_switch_1back+mismatch_task_stay_cue_switch_1back)-1/2*(match_task_stay_cue_stay_1back+mismatch_task_stay_cue_stay_1back)"
  nBackWSpatialTS_nBack_off_task_switch_cost: "1/2*(match_task_switch_cue_switch_1back+mismatch_task_switch_cue_switch_1back)-1/2*(match_task_stay_cue_switch_1back+mismatch_task_stay_cue_switch_1back)"
  nBackWSpatialTS_spatialTS_2back_minus_1back: "1/6*(match_task_stay_cue_stay_2back+match_task_stay_cue_switch_2back+match_task_switch_cue_switch_2back+mismatch_task_stay_cue_stay_2back+mismatch_task_stay_cue_switch_2back+mismatch_task_switch_cue_switch_2back)-1/6*(match_task_stay_cue_stay_1back+match_task_stay_cue_switch_1back+match_task_switch_cue_switch_1back+mismatch_task_stay_cue_stay_1back+mismatch_task_stay_cue_switch_1back+mismatch_task_switch_cue_switch_1back)"
  nBackWSpatialTS_nBack_cue_switch_cost: "1/4*(match_task_stay_cue_switch_1back+match_task_stay_cue_switch_2back+mismatch_task_stay_cue_switch_1back+mismatch_task_stay_cue_switch_2back)-1/4*(match_task_stay_cue_stay_1back+match_task_stay_cue_stay_2back+mismatch_task_stay_cue_stay_1back+mismatch_task_stay_cue_stay_2back)"
  nBackWSpatialTS_nBack_task_switch_cost: "1/4*(match_task_switch_cue_switch_1back+match_task_switch_cue_switch_2back+mismatch_task_switch_cue_switch_1back+mismatch_task_switch_cue_switch_2back)-1/4*(match_task_stay_cue_switch_1back+match_task_stay_cue_switch_2back+mismatch_task_stay_cue_switch_1back+mismatch_task_stay_cue_switch_2back)"
  nBackWSpatialTS_cue_switch_cost_interaction: "(1/2*(match_task_stay_cue_switch_2back+mismatch_task_stay_cue_switch_2back)-1/2*(match_task_stay_cue_stay_2back+mismatch_task_stay_cue_stay_2back))-(1/2*(match_task_stay_cue_switch_1back+mismatch_task_stay_cue_switch_1back)-1/2*(match_task_stay_cue_stay_1back+mismatch_task_stay_cue_stay_1back))"
  nBackWSpatialTS_task_switch_cost_interaction: "(1/2*(match_task_switch_cue_switch_2back+mismatch_task_switch_cue_switch_2back)-1/2*(match_task_stay_cue_switch_2back+mismatch_task_stay_cue_switch_2back))-(1/2*(match_task_switch_cue_switch_1back+mismatch_task_switch_cue_switch_1back)-1/2*(match_task_stay_cue_switch_1back+mismatch_task_stay_cue_switch_1back))"
  task-baseline: "1/12*(mismatch_task_stay_cue_stay_1back+mismatch_task_stay_cue_switch_1back+mismatch_task_switch_cue_switch_1back+match_task_stay_cue_stay_1back+match_task_stay_cue_switch_1back+match_task_switch_cue_switch_1back+mismatch_task_stay_cue_stay_2back+mismatch_task_stay_cue_switch_2back+mismatch_task_switch_cue_switch_2back+match_task_stay_cue_stay_2back+match_task_stay_cue_switch_2back+match_task_switch_cue_switch_2back)"
  response_time: "response_time"
