tr: 1.49
dummy_scans: 7
min_rt: 0.2
expected_sessions: 2

# Spatial task-switching + cued task-switching dual task
# Trial types cross spatial and cued switch conditions.
# The response_time regressor uses RT as duration (RTDur model).

regressors:
  omission:
    amplitude: omission
    duration: duration
    subset: null

  commission:
    amplitude: commission
    duration: duration
    subset: null

  rt_fast:
    amplitude: rt_too_fast
    duration: duration
    subset: null

  cued_task_stay_cue_stay_spatial_task_stay_cue_stay:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == "cuedtstaycstay_spatialtstaycstay" and key_press == correct_response and
      response_time >= 0.2

  cued_task_stay_cue_stay_spatial_task_stay_cue_switch:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == "cuedtstaycstay_spatialtstaycswitch" and key_press == correct_response and
      response_time >= 0.2

  cued_task_stay_cue_stay_spatial_task_switch_cue_switch:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == "cuedtstaycstay_spatialtswitchcswitch" and key_press == correct_response
      and response_time >= 0.2

  cued_task_switch_cue_switch_spatial_task_stay_cue_stay:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == "cuedtswitchcswitch_spatialtstaycstay" and key_press == correct_response
      and response_time >= 0.2

  cued_task_stay_cue_switch_spatial_task_stay_cue_switch:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == "cuedtstaycswitch_spatialtstaycswitch" and key_press == correct_response
      and response_time >= 0.2

  cued_task_stay_cue_switch_spatial_task_switch_cue_switch:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == "cuedtstaycswitch_spatialtswitchcswitch" and key_press == correct_response
      and response_time >= 0.2

  cued_task_switch_cue_switch_spatial_task_stay_cue_switch:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == "cuedtswitchcswitch_spatialtstaycswitch" and key_press == correct_response
      and response_time >= 0.2

  cued_task_switch_cue_switch_spatial_task_switch_cue_switch:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == "cuedtswitchcswitch_spatialtswitchcswitch" and key_press ==
      correct_response and response_time >= 0.2

  cued_task_stay_cue_switch_spatial_task_stay_cue_stay:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == "cuedtstaycswitch_spatialtstaycstay" and key_press == correct_response and
      response_time >= 0.2

  response_time:
    amplitude: 1
    duration: response_time
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_id == 'test_trial'

  break_with_performance_feedback:
    amplitude: 1
    duration: 10
    subset: >-
      trial_id == 'break_with_performance_feedback'
    events_query_min_coverage: 0.0

contrasts:
  cued_task_stay_cue_stay_spatial_task_stay_cue_stay: "cued_task_stay_cue_stay_spatial_task_stay_cue_stay"
  cued_task_stay_cue_stay_spatial_task_stay_cue_switch: "cued_task_stay_cue_stay_spatial_task_stay_cue_switch"
  cued_task_stay_cue_stay_spatial_task_switch_cue_switch: "cued_task_stay_cue_stay_spatial_task_switch_cue_switch"
  cued_task_stay_cue_switch_spatial_task_stay_cue_stay: "cued_task_stay_cue_switch_spatial_task_stay_cue_stay"
  cued_task_stay_cue_switch_spatial_task_stay_cue_switch: "cued_task_stay_cue_switch_spatial_task_stay_cue_switch"
  cued_task_stay_cue_switch_spatial_task_switch_cue_switch: "cued_task_stay_cue_switch_spatial_task_switch_cue_switch"
  cued_task_switch_cue_switch_spatial_task_stay_cue_stay: "cued_task_switch_cue_switch_spatial_task_stay_cue_stay"
  cued_task_switch_cue_switch_spatial_task_stay_cue_switch: "cued_task_switch_cue_switch_spatial_task_stay_cue_switch"
  cued_task_switch_cue_switch_spatial_task_switch_cue_switch: "cued_task_switch_cue_switch_spatial_task_switch_cue_switch"
  spatialTSWCuedTS_cuedTS_cue_switch_cost_simple: "cued_task_stay_cue_switch_spatial_task_stay_cue_stay-cued_task_stay_cue_stay_spatial_task_stay_cue_stay"
  spatialTSWCuedTS_cuedTS_task_switch_cost_simple: "cued_task_switch_cue_switch_spatial_task_stay_cue_stay-cued_task_stay_cue_switch_spatial_task_stay_cue_stay"
  spatialTSWCuedTS_spatialTS_cue_switch_cost_simple: "cued_task_stay_cue_stay_spatial_task_stay_cue_switch-cued_task_stay_cue_stay_spatial_task_stay_cue_stay"
  spatialTSWCuedTS_spatialTS_task_switch_cost_simple: "cued_task_stay_cue_stay_spatial_task_switch_cue_switch-cued_task_stay_cue_stay_spatial_task_stay_cue_switch"
  spatialTSWCuedTS_cuedTS_cue_switch_cost: "1/3*(cued_task_stay_cue_switch_spatial_task_stay_cue_stay+cued_task_stay_cue_switch_spatial_task_stay_cue_switch+cued_task_stay_cue_switch_spatial_task_switch_cue_switch)-1/3*(cued_task_stay_cue_stay_spatial_task_stay_cue_stay+cued_task_stay_cue_stay_spatial_task_stay_cue_switch+cued_task_stay_cue_stay_spatial_task_switch_cue_switch)"
  spatialTSWCuedTS_cuedTS_task_switch_cost: "1/3*(cued_task_switch_cue_switch_spatial_task_stay_cue_stay+cued_task_switch_cue_switch_spatial_task_stay_cue_switch+cued_task_switch_cue_switch_spatial_task_switch_cue_switch)-1/3*(cued_task_stay_cue_switch_spatial_task_stay_cue_stay+cued_task_stay_cue_switch_spatial_task_stay_cue_switch+cued_task_stay_cue_switch_spatial_task_switch_cue_switch)"
  spatialTSWCuedTS_spatialTS_cue_switch_cost: "1/3*(cued_task_stay_cue_stay_spatial_task_stay_cue_switch+cued_task_stay_cue_switch_spatial_task_stay_cue_switch+cued_task_switch_cue_switch_spatial_task_stay_cue_switch)-1/3*(cued_task_stay_cue_stay_spatial_task_stay_cue_stay+cued_task_stay_cue_switch_spatial_task_stay_cue_stay+cued_task_switch_cue_switch_spatial_task_stay_cue_stay)"
  spatialTSWCuedTS_spatialTS_task_switch_cost: "1/3*(cued_task_stay_cue_stay_spatial_task_switch_cue_switch+cued_task_stay_cue_switch_spatial_task_switch_cue_switch+cued_task_switch_cue_switch_spatial_task_switch_cue_switch)-1/3*(cued_task_stay_cue_stay_spatial_task_stay_cue_switch+cued_task_stay_cue_switch_spatial_task_stay_cue_switch+cued_task_switch_cue_switch_spatial_task_stay_cue_switch)"
  spatialTSWCuedTS_cue_switch_cost_interaction: "1/2*(cued_task_stay_cue_switch_spatial_task_stay_cue_switch-cued_task_stay_cue_stay_spatial_task_stay_cue_switch)-1/2*(cued_task_stay_cue_switch_spatial_task_stay_cue_stay-cued_task_stay_cue_stay_spatial_task_stay_cue_stay)"
  spatialTSWCuedTS_task_switch_cost_interaction: "1/2*(cued_task_switch_cue_switch_spatial_task_switch_cue_switch-cued_task_stay_cue_switch_spatial_task_switch_cue_switch)-1/2*(cued_task_switch_cue_switch_spatial_task_stay_cue_switch-cued_task_stay_cue_switch_spatial_task_stay_cue_switch)"
  task-baseline: "1/9*(cued_task_stay_cue_stay_spatial_task_stay_cue_stay+cued_task_stay_cue_stay_spatial_task_stay_cue_switch+cued_task_stay_cue_stay_spatial_task_switch_cue_switch+cued_task_stay_cue_switch_spatial_task_stay_cue_stay+cued_task_stay_cue_switch_spatial_task_stay_cue_switch+cued_task_stay_cue_switch_spatial_task_switch_cue_switch+cued_task_switch_cue_switch_spatial_task_stay_cue_stay+cued_task_switch_cue_switch_spatial_task_stay_cue_switch+cued_task_switch_cue_switch_spatial_task_switch_cue_switch)"
  response_time: "response_time"
