    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type ==
      'DNN_tstay_cstay'

  response_time:
    amplitude: 1
    duration: response_time
    subset: >-
      trial_id == 'test_trial' and key_press == correct_response and response_time >= 0.2 and
      trial_type != 'tn/a_cn/a'

  break_with_performance_feedback:
    amplitude: 1
    duration: 10
    subset: >-
      trial_id == 'break_with_performance_feedback'
    events_query_min_coverage: 0.0

contrasts:
  SSS_task_switch_cue_switch: "SSS_task_switch_cue_switch"
  SSS_task_stay_cue_switch: "SSS_task_stay_cue_switch"
  SSS_task_stay_cue_stay: "SSS_task_stay_cue_stay"
