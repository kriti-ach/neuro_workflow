  shapeMatchingWCuedTS_cuedTS_off_main_vars: "1/3*(SDD_task_stay_cue_stay+DDD_task_stay_cue_stay+DDS_task_stay_cue_stay)-1/2*(SNN_task_stay_cue_stay+DNN_task_stay_cue_stay)"
  shapeMatchingWCuedTS_shapeMatching_cue_switch_cost: "1/7*(SSS_task_stay_cue_switch+SDD_task_stay_cue_switch+SNN_task_stay_cue_switch+DSD_task_stay_cue_switch+DNN_task_stay_cue_switch+DDD_task_stay_cue_switch+DDS_task_stay_cue_switch)-1/7*(SSS_task_stay_cue_stay+SDD_task_stay_cue_stay+SNN_task_stay_cue_stay+DSD_task_stay_cue_stay+DNN_task_stay_cue_stay+DDD_task_stay_cue_stay+DDS_task_stay_cue_stay)"
  shapeMatchingWCuedTS_shapeMatching_task_switch_cost: "1/7*(SSS_task_switch_cue_switch+SDD_task_switch_cue_switch+SNN_task_switch_cue_switch+DSD_task_switch_cue_switch+DNN_task_switch_cue_switch+DDD_task_switch_cue_switch+DDS_task_switch_cue_switch)-1/7*(SSS_task_stay_cue_switch+SDD_task_stay_cue_switch+SNN_task_stay_cue_switch+DSD_task_stay_cue_switch+DNN_task_stay_cue_switch+DDD_task_stay_cue_switch+DDS_task_stay_cue_switch)"
  shapeMatchingWCuedTS_cuedTS_main_vars: "1/9*(SDD_task_stay_cue_stay+DDD_task_stay_cue_stay+DDS_task_stay_cue_stay+SDD_task_stay_cue_switch+DDD_task_stay_cue_switch+DDS_task_stay_cue_switch+SDD_task_switch_cue_switch+DDD_task_switch_cue_switch+DDS_task_switch_cue_switch)-1/6*(SNN_task_stay_cue_stay+DNN_task_stay_cue_stay+SNN_task_stay_cue_switch+DNN_task_stay_cue_switch+SNN_task_switch_cue_switch+DNN_task_switch_cue_switch)"
  shapeMatchingWCuedTS_cue_switch_cost_interaction: "1/3*(SDD_task_stay_cue_switch+DDD_task_stay_cue_switch+DDS_task_stay_cue_switch)-1/3*(SDD_task_stay_cue_stay+DDD_task_stay_cue_stay+DDS_task_stay_cue_stay)-1/2*(SNN_task_stay_cue_switch+DNN_task_stay_cue_switch)+1/2*(SNN_task_stay_cue_stay+DNN_task_stay_cue_stay)"
  shapeMatchingWCuedTS_task_switch_cost_interaction: "1/3*(SDD_task_switch_cue_switch+DDD_task_switch_cue_switch+DDS_task_switch_cue_switch)-1/3*(SDD_task_stay_cue_switch+DDD_task_stay_cue_switch+DDS_task_stay_cue_switch)-1/2*(SNN_task_switch_cue_switch+DNN_task_switch_cue_switch)+1/2*(SNN_task_stay_cue_switch+DNN_task_stay_cue_switch)"
