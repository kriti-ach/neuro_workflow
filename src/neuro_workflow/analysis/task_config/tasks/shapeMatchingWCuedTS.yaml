  DNN_task_switch_cue_switch:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type ==
      'DNN_tswitch_cswitch'

  DNN_task_stay_cue_switch:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type ==
      'DNN_tstay_cswitch'

  DNN_task_stay_cue_stay:
