    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type ==
      'SNN_tstay_cswitch'

  SNN_task_stay_cue_stay:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type ==
      'SNN_tstay_cstay'

  DSD_task_switch_cue_switch:
