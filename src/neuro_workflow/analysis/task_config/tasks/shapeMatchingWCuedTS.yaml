      'DSD_tstay_cstay'

  DDD_task_switch_cue_switch:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type ==
      'DDD_tswitch_cswitch'

  DDD_task_stay_cue_switch:
    amplitude: 1
    duration: 1
    subset: >-
