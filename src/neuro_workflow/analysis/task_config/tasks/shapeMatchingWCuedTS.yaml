tr: 1.49
dummy_scans: 7
min_rt: 0.2
expected_sessions: 2

# Shape-matching + cued task-switching dual task
# Trial types cross shape-matching condition with cue/task switch condition.
# The response_time regressor uses RT as duration (RTDur model).

regressors:
  omission:
    amplitude: omission
    duration: duration
    subset: null

  commission:
    amplitude: commission
    duration: duration
    subset: null

  rt_fast:
    amplitude: rt_too_fast
    duration: duration
    subset: null

  n/a:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type == 'tn/a_cn/a'

  SSS_task_switch_cue_switch:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type ==
      'SSS_tswitch_cswitch'

  SSS_task_stay_cue_switch:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type ==
      'SSS_tstay_cswitch'

  SSS_task_stay_cue_stay:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type ==
      'SSS_tstay_cstay'

  SDD_task_switch_cue_switch:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type ==
      'SDD_tswitch_cswitch'

  SDD_task_stay_cue_switch:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type ==
      'SDD_tstay_cswitch'

  SDD_task_stay_cue_stay:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type ==
      'SDD_tstay_cstay'

