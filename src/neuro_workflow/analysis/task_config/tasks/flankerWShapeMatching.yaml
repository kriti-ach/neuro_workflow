tr: 1.49
dummy_scans: 7
min_rt: 0.2
expected_sessions: 2

# Flanker + shape-matching dual task
# Trial types cross flanker congruency with shape-matching condition.
# The response_time regressor uses RT as duration (RTDur model).

regressors:
  omission:
    amplitude: omission
    duration: duration
    subset: null

  commission:
    amplitude: commission
    duration: duration
    subset: null

  rt_fast:
    amplitude: rt_too_fast
    duration: duration
    subset: null

  congruent_SSS:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type == 'congruent_SSS'

  congruent_SDD:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type == 'congruent_SDD'

  congruent_SNN:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type == 'congruent_SNN'

  congruent_DSD:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type == 'congruent_DSD'

  congruent_DDD:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type == 'congruent_DDD'

  congruent_DDS:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type == 'congruent_DDS'

  congruent_DNN:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type == 'congruent_DNN'

  incongruent_SSS:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type ==
      'incongruent_SSS'

  incongruent_SDD:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type ==
      'incongruent_SDD'

  incongruent_SNN:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type ==
      'incongruent_SNN'

  incongruent_DSD:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type ==
      'incongruent_DSD'

  incongruent_DDD:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type ==
      'incongruent_DDD'

  incongruent_DDS:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type ==
      'incongruent_DDS'

  incongruent_DNN:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type ==
      'incongruent_DNN'

  response_time:
    amplitude: 1
    duration: response_time
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_id == 'test_trial'

  break_with_performance_feedback:
    amplitude: 1
    duration: 10
    subset: >-
      trial_id == 'break_with_performance_feedback'
    events_query_min_coverage: 0.0

contrasts:
  congruent_SSS: "congruent_SSS"
  congruent_SDD: "congruent_SDD"
  congruent_SNN: "congruent_SNN"
  congruent_DSD: "congruent_DSD"
  congruent_DNN: "congruent_DNN"
  congruent_DDD: "congruent_DDD"
  congruent_DDS: "congruent_DDS"
  incongruent_SSS: "incongruent_SSS"
  incongruent_SDD: "incongruent_SDD"
  incongruent_SNN: "incongruent_SNN"
  incongruent_DSD: "incongruent_DSD"
  incongruent_DNN: "incongruent_DNN"
  incongruent_DDD: "incongruent_DDD"
  incongruent_DDS: "incongruent_DDS"
  flankerWShapeMatching_shapeMatching_off_incongruent_minus_congruent: "1/2*(incongruent_SNN+incongruent_DNN)-1/2*(congruent_SNN+congruent_DNN)"
  flankerWShapeMatching_flanker_off_main_vars: "1/3*(congruent_SDD+congruent_DDD+congruent_DDS)-1/2*(congruent_SNN+congruent_DNN)"
  flankerWShapeMatching_shapeMatching_incongruent_minus_congruent: "1/7*(incongruent_SSS+incongruent_SDD+incongruent_SNN+incongruent_DSD+incongruent_DNN+incongruent_DDD+incongruent_DDS)-1/7*(congruent_SSS+congruent_SDD+congruent_SNN+congruent_DSD+congruent_DNN+congruent_DDD+congruent_DDS)"
  flankerWShapeMatching_flanker_main_vars: "1/6*(congruent_SDD+congruent_DDD+congruent_DDS+incongruent_SDD+incongruent_DDD+incongruent_DDS)-1/4*(congruent_SNN+congruent_DNN+incongruent_SNN+incongruent_DNN)"
  flankerWShapeMatching_interaction: "(1/3*(incongruent_SDD+incongruent_DDD+incongruent_DDS)-1/3*(congruent_SDD+congruent_DDD+congruent_DDS))-(1/2*(incongruent_SNN+incongruent_DNN)-1/2*(congruent_SNN+congruent_DNN))"
  task-baseline: "1/14*(congruent_SSS+congruent_SDD+congruent_SNN+congruent_DSD+congruent_DNN+congruent_DDD+congruent_DDS+incongruent_SSS+incongruent_SDD+incongruent_SNN+incongruent_DSD+incongruent_DNN+incongruent_DDD+incongruent_DDS)"
  response_time: "response_time"
