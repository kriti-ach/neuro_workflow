tr: 1.49
dummy_scans: 7
min_rt: 0.2
expected_sessions: 2

# Directed forgetting + flanker dual task
# Trial types cross directed-forgetting condition with flanker congruency.
# The response_time regressor uses RT as duration (RTDur model).

regressors:
  omission:
    amplitude: omission
    duration: duration
    subset: null

  commission:
    amplitude: commission
    duration: duration
    subset: null

  rt_fast:
    amplitude: rt_too_fast
    duration: duration
    subset: null

  memory_and_cue:
    amplitude: 1
    duration: duration
    subset: >-
      trial_id == "test_four_letters" or trial_id == "test_cue"

  congruent_pos:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type == "congruent_pos"

  congruent_neg:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type == "congruent_neg"

  congruent_con:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type == "congruent_con"

  incongruent_pos:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type ==
      "incongruent_pos"

  incongruent_neg:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type ==
      "incongruent_neg"

  incongruent_con:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type ==
      "incongruent_con"

  response_time:
    amplitude: 1
    duration: response_time
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_id == 'test_trial'

  break_with_performance_feedback:
    amplitude: 1
    duration: 10
    subset: >-
      trial_id == 'break_with_performance_feedback'
    events_query_min_coverage: 0.0

contrasts:
  congruent_pos: "congruent_pos"
  congruent_neg: "congruent_neg"
  congruent_con: "congruent_con"
  incongruent_pos: "incongruent_pos"
  incongruent_neg: "incongruent_neg"
  incongruent_con: "incongruent_con"
  congruent_neg-congruent_con: "congruent_neg-congruent_con"
  incongruent_con-congruent_con: "incongruent_con-congruent_con"
  directedForgettingWFlanker_interaction: "1/2*(incongruent_neg+congruent_con)-1/2*(incongruent_con+congruent_neg)"
  task-baseline: "1/7*(congruent_pos+congruent_neg+congruent_con+incongruent_pos+incongruent_neg+incongruent_con+memory_and_cue)"
  response_time: "response_time"
