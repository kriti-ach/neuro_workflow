tr: 1.49
dummy_scans: 7
min_rt: 0.2
expected_sessions: 2

# Directed forgetting + cued task-switching dual task
# Trial types cross directed-forgetting condition with cue/task switch condition.
# The response_time regressor uses RT as duration (RTDur model).

regressors:
  omission:
    amplitude: omission
    duration: duration
    subset: null

  commission:
    amplitude: commission
    duration: duration
    subset: null

  rt_fast:
    amplitude: rt_too_fast
    duration: duration
    subset: null

  n/a:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type == 'n/a'

  neg_task_switch_cue_switch:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == "neg_tswitch_cswitch" and key_press == correct_response and response_time
      >= 0.2

  neg_task_stay_cue_switch:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == "neg_tstay_cswitch" and key_press == correct_response and response_time >=
      0.2

  neg_task_stay_cue_stay:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == "neg_tstay_cstay" and key_press == correct_response and response_time >=
      0.2

  pos_task_switch_cue_switch:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == "pos_tswitch_cswitch" and key_press == correct_response and response_time
      >= 0.2

  pos_task_stay_cue_switch:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == "pos_tstay_cswitch" and key_press == correct_response and response_time >=
      0.2

  pos_task_stay_cue_stay:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == "pos_tstay_cstay" and key_press == correct_response and response_time >=
      0.2

  con_task_switch_cue_switch:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == "con_tswitch_cswitch" and key_press == correct_response and response_time
      >= 0.2

  con_task_stay_cue_switch:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == "con_tstay_cswitch" and key_press == correct_response and response_time >=
      0.2

  con_task_stay_cue_stay:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == "con_tstay_cstay" and key_press == correct_response and response_time >=
      0.2

  response_time:
    amplitude: 1
    duration: response_time
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_id == 'test_trial' and
      trial_type != 'n/a'

  break_with_performance_feedback:
    amplitude: 1
    duration: 10
    subset: >-
      trial_id == 'break_with_performance_feedback'
    events_query_min_coverage: 0.0

contrasts:
  neg_task_switch_cue_switch: "neg_task_switch_cue_switch"
  neg_task_stay_cue_switch: "neg_task_stay_cue_switch"
  neg_task_stay_cue_stay: "neg_task_stay_cue_stay"
  pos_task_switch_cue_switch: "pos_task_switch_cue_switch"
  pos_task_stay_cue_switch: "pos_task_stay_cue_switch"
  pos_task_stay_cue_stay: "pos_task_stay_cue_stay"
  con_task_switch_cue_switch: "con_task_switch_cue_switch"
  con_task_stay_cue_switch: "con_task_stay_cue_switch"
  con_task_stay_cue_stay: "con_task_stay_cue_stay"
  con_task_stay_cue_switch-con_task_stay_cue_stay: "con_task_stay_cue_switch-con_task_stay_cue_stay"
  con_task_switch_cue_switch-con_task_stay_cue_switch: "con_task_switch_cue_switch-con_task_stay_cue_switch"
  neg_task_stay_cue_stay-con_task_stay_cue_stay: "neg_task_stay_cue_stay-con_task_stay_cue_stay"
  directedForgettingWCuedTS_directedForgetting_cue_switch_cost: "1/3*(neg_task_stay_cue_switch+pos_task_stay_cue_switch+con_task_stay_cue_switch)-1/3*(neg_task_stay_cue_stay+pos_task_stay_cue_stay+con_task_stay_cue_stay)"
  directedForgettingWCuedTS_directedForgetting_task_switch_cost: "1/3*(neg_task_switch_cue_switch+pos_task_switch_cue_switch+con_task_switch_cue_switch)-1/3*(neg_task_stay_cue_switch+pos_task_stay_cue_switch+con_task_stay_cue_switch)"
  directedForgettingWCuedTS_directedForgetting_contrast_across_cuedTS: "1/3*(neg_task_stay_cue_stay+neg_task_stay_cue_switch+neg_task_switch_cue_switch)-1/3*(con_task_stay_cue_stay+con_task_stay_cue_switch+con_task_switch_cue_switch)"
  directedForgettingWCuedTS_cue_switch_cost_interaction: "1/2*(neg_task_stay_cue_switch-con_task_stay_cue_switch)-1/2*(neg_task_stay_cue_stay-con_task_stay_cue_stay)"
  directedForgettingWCuedTS_task_switch_cost_interaction: "1/2*(neg_task_switch_cue_switch-con_task_switch_cue_switch)-1/2*(neg_task_stay_cue_switch-con_task_stay_cue_switch)"
  task-baseline: "1/9*(neg_task_switch_cue_switch+neg_task_stay_cue_switch+neg_task_stay_cue_stay+pos_task_switch_cue_switch+pos_task_stay_cue_switch+pos_task_stay_cue_stay+con_task_switch_cue_switch+con_task_stay_cue_switch+con_task_stay_cue_stay)"
  response_time: "response_time"
