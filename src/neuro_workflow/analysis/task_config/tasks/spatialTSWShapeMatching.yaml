    duration: 1
    subset: >-
      trial_type == 'tswitch_cswitch_DNN' and key_press == correct_response and response_time
      >= 0.2

  task_switch_cue_switch_DDD:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'tswitch_cswitch_DDD' and key_press == correct_response and response_time
      >= 0.2

  task_switch_cue_switch_DDS:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'tswitch_cswitch_DDS' and key_press == correct_response and response_time
      >= 0.2

  response_time:
    amplitude: 1
    duration: response_time
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_id == 'test_trial' and
      trial_type != 'n/a'

  break_with_performance_feedback:
    amplitude: 1
    duration: 10
    subset: >-
      trial_id == 'break_with_performance_feedback'
    events_query_min_coverage: 0.0

