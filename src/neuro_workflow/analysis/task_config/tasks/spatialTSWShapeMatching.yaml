    duration: 1
    subset: >-
      trial_type == 'tstay_cswitch_DNN' and key_press == correct_response and response_time >=
      0.2

  task_stay_cue_switch_DDD:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'tstay_cswitch_DDD' and key_press == correct_response and response_time >=
      0.2

  task_stay_cue_switch_DDS:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'tstay_cswitch_DDS' and key_press == correct_response and response_time >=
      0.2

  task_switch_cue_switch_SSS:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'tswitch_cswitch_SSS' and key_press == correct_response and response_time
      >= 0.2

  task_switch_cue_switch_SDD:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'tswitch_cswitch_SDD' and key_press == correct_response and response_time
      >= 0.2

  task_switch_cue_switch_SNN:
    amplitude: 1
    duration: 1
    subset: >-
