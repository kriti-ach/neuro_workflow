tr: 1.49
dummy_scans: 7
min_rt: 0.2
expected_sessions: 2

# Spatial task-switching + shape-matching dual task
# Trial types cross spatial switch condition with shape-matching condition.
# The response_time regressor uses RT as duration (RTDur model).

regressors:
  omission:
    amplitude: omission
    duration: duration
    subset: null

  commission:
    amplitude: commission
    duration: duration
    subset: null

  rt_fast:
    amplitude: rt_too_fast
    duration: duration
    subset: null

  n/a:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type == 'n/a'

  task_stay_cue_stay_SSS:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'tstay_cstay_SSS' and key_press == correct_response and response_time >=
      0.2

  task_stay_cue_stay_SDD:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'tstay_cstay_SDD' and key_press == correct_response and response_time >=
      0.2

  task_stay_cue_stay_SNN:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'tstay_cstay_SNN' and key_press == correct_response and response_time >=
      0.2

  task_stay_cue_stay_DSD:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'tstay_cstay_DSD' and key_press == correct_response and response_time >=
      0.2

  task_stay_cue_stay_DNN:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'tstay_cstay_DNN' and key_press == correct_response and response_time >=
      0.2

  task_stay_cue_stay_DDD:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'tstay_cstay_DDD' and key_press == correct_response and response_time >=
      0.2

  task_stay_cue_stay_DDS:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'tstay_cstay_DDS' and key_press == correct_response and response_time >=
      0.2

  task_stay_cue_switch_SSS:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'tstay_cswitch_SSS' and key_press == correct_response and response_time >=
      0.2

  task_stay_cue_switch_SDD:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'tstay_cswitch_SDD' and key_press == correct_response and response_time >=
      0.2

  task_stay_cue_switch_SNN:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'tstay_cswitch_SNN' and key_press == correct_response and response_time >=
