  spatialTSWShapeMatching_shapeMatching_cue_switch_cost: "1/7*(task_stay_cue_switch_SSS+task_stay_cue_switch_SDD+task_stay_cue_switch_SNN+task_stay_cue_switch_DSD+task_stay_cue_switch_DNN+task_stay_cue_switch_DDD+task_stay_cue_switch_DDS)-1/7*(task_stay_cue_stay_SSS+task_stay_cue_stay_SDD+task_stay_cue_stay_SNN+task_stay_cue_stay_DSD+task_stay_cue_stay_DNN+task_stay_cue_stay_DDD+task_stay_cue_stay_DDS)"
  spatialTSWShapeMatching_shapeMatching_task_switch_cost: "1/7*(task_switch_cue_switch_SSS+task_switch_cue_switch_SDD+task_switch_cue_switch_SNN+task_switch_cue_switch_DSD+task_switch_cue_switch_DNN+task_switch_cue_switch_DDD+task_switch_cue_switch_DDS)-1/7*(task_stay_cue_switch_SSS+task_stay_cue_switch_SDD+task_stay_cue_switch_SNN+task_stay_cue_switch_DSD+task_stay_cue_switch_DNN+task_stay_cue_switch_DDD+task_stay_cue_switch_DDS)"
  spatialTSWShapeMatching_spatialTS_main_vars: "1/9*(task_stay_cue_stay_SDD+task_stay_cue_stay_DDD+task_stay_cue_stay_DDS+task_stay_cue_switch_SDD+task_stay_cue_switch_DDD+task_stay_cue_switch_DDS+task_switch_cue_switch_SDD+task_switch_cue_switch_DDD+task_switch_cue_switch_DDS)-1/6*(task_stay_cue_stay_SNN+task_stay_cue_stay_DNN+task_stay_cue_switch_SNN+task_stay_cue_switch_DNN+task_switch_cue_switch_SNN+task_switch_cue_switch_DNN)"
  spatialTSWShapeMatching_cue_switch_cost_interaction: "(1/3*(task_stay_cue_switch_SDD+task_stay_cue_switch_DDD+task_stay_cue_switch_DDS)-1/3*(task_stay_cue_stay_SDD+task_stay_cue_stay_DDD+task_stay_cue_stay_DDS))-(1/2*(task_stay_cue_switch_SNN+task_stay_cue_switch_DNN)-1/2*(task_stay_cue_stay_SNN+task_stay_cue_stay_DNN))"
