tr: 1.49
dummy_scans: 7
min_rt: 0.2
expected_sessions: 2

# N-back + shape-matching dual task
# Trial types cross match/mismatch and delay with shape-matching condition.
# The response_time regressor uses RT as duration (RTDur model).

regressors:
  omission:
    amplitude: omission
    duration: duration
    subset: null

  commission:
    amplitude: commission
    duration: duration
    subset: null

  rt_fast:
    amplitude: rt_too_fast
    duration: duration
    subset: null

  n/a:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_type == 'n/a'

  match_td_same_1back:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'match_td_same_1back' and key_press == correct_response and response_time
      >= 0.2

  match_td_same_2back:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'match_td_same_2back' and key_press == correct_response and response_time
      >= 0.2

  match_td_diff_1back:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'match_td_diff_1back' and key_press == correct_response and response_time
      >= 0.2

  match_td_diff_2back:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'match_td_diff_2back' and key_press == correct_response and response_time
      >= 0.2

  match_td_na_1back:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'match_td_na_1back' and key_press == correct_response and response_time >=
      0.2

  match_td_na_2back:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'match_td_na_2back' and key_press == correct_response and response_time >=
      0.2

  mismatch_td_same_1back:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'mismatch_td_same_1back' and key_press == correct_response and
      response_time >= 0.2

  mismatch_td_same_2back:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'mismatch_td_same_2back' and key_press == correct_response and
      response_time >= 0.2

  mismatch_td_diff_1back:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'mismatch_td_diff_1back' and key_press == correct_response and
      response_time >= 0.2

  mismatch_td_diff_2back:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'mismatch_td_diff_2back' and key_press == correct_response and
      response_time >= 0.2

  mismatch_td_na_1back:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'mismatch_td_na_1back' and key_press == correct_response and response_time
      >= 0.2

  mismatch_td_na_2back:
    amplitude: 1
    duration: 1
    subset: >-
      trial_type == 'mismatch_td_na_2back' and key_press == correct_response and response_time
      >= 0.2

  response_time:
    amplitude: 1
    duration: response_time
    subset: >-
      key_press == correct_response and response_time >= 0.2 and trial_id == 'test_trial' and
      trial_type != 'n/a'

  break_with_performance_feedback:
    amplitude: 1
    duration: 10
    subset: >-
      trial_id == 'break_with_performance_feedback'
    events_query_min_coverage: 0.0

contrasts:
  match_td_same_1back: "match_td_same_1back"
  match_td_same_2back: "match_td_same_2back"
  match_td_diff_1back: "match_td_diff_1back"
  match_td_diff_2back: "match_td_diff_2back"
  match_td_na_1back: "match_td_na_1back"
  match_td_na_2back: "match_td_na_2back"
  mismatch_td_same_1back: "mismatch_td_same_1back"
  mismatch_td_same_2back: "mismatch_td_same_2back"
  mismatch_td_diff_1back: "mismatch_td_diff_1back"
  mismatch_td_diff_2back: "mismatch_td_diff_2back"
  mismatch_td_na_1back: "mismatch_td_na_1back"
  mismatch_td_na_2back: "mismatch_td_na_2back"
  nBackWShapeMatching_shapeMatching_off_2back_minus_1back: "1/2*(match_td_na_2back+mismatch_td_na_2back)-1/2*(match_td_na_1back+mismatch_td_na_1back)"
  nBackWShapeMatching_nBack_off_main_vars: "1/2*(match_td_diff_1back+mismatch_td_diff_1back)-1/2*(match_td_na_1back+mismatch_td_na_1back)"
  nBackWShapeMatching_shapeMatching_2back_minus_1back: "1/6*(match_td_same_2back+match_td_diff_2back+match_td_na_2back+mismatch_td_same_2back+mismatch_td_diff_2back+mismatch_td_na_2back)-1/6*(match_td_same_1back+match_td_diff_1back+match_td_na_1back+mismatch_td_same_1back+mismatch_td_diff_1back+mismatch_td_na_1back)"
  nBackWShapeMatching_nBack_main_vars: "1/4*(match_td_diff_2back+match_td_diff_1back+mismatch_td_diff_2back+mismatch_td_diff_1back)-1/4*(match_td_na_2back+match_td_na_1back+mismatch_td_na_2back+mismatch_td_na_1back)"
  nBackWShapeMatching_interaction: "1/2*(match_td_diff_2back+mismatch_td_diff_2back)-1/2*(match_td_na_2back+mismatch_td_na_2back)-1/2*(match_td_diff_1back+mismatch_td_diff_1back)+1/2*(match_td_na_1back+mismatch_td_na_1back)"
  task-baseline: "1/12*(match_td_same_1back+match_td_same_2back+match_td_diff_1back+match_td_diff_2back+match_td_na_1back+match_td_na_2back+mismatch_td_same_1back+mismatch_td_same_2back+mismatch_td_diff_1back+mismatch_td_diff_2back+mismatch_td_na_1back+mismatch_td_na_2back)"
  response_time: "response_time"
